name: Java core build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify standalone engine
        run: mvn --batch-mode --no-transfer-progress clean verify
